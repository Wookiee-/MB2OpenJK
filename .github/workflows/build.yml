name: Build

on:
  workflow_dispatch:
  push:
    branches: [master, experimental]

# Only one run per branch at a time; a new push cancels the superseded run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  windows:
    name: Build Windows Client (VS 2022, Win32, Release)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      shell: powershell
      run: cmake -S $env:GITHUB_WORKSPACE -B build -A Win32 -DBuildPortableVersion=ON

    - name: Build
      shell: powershell
      run: cmake --build build --config Release

    - name: Set LAA
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Apply LAA flag
      shell: powershell
      run: editbin.exe /largeaddressaware build/Release/mbii.x86.exe

    - name: Upload Build
      uses: actions/upload-artifact@v4
      with:
        name: Windows Build Release
        path: |
            build/Release
            !build/Release/compact_glsl.exe

  linux:
    name: Build Linux Client (Release)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      shell: bash
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get -q update
        sudo apt-get -q install -y --no-install-recommends \
          gcc-multilib g++-multilib cmake \
          libjpeg-dev libjpeg-dev:i386 \
          libpng-dev libpng-dev:i386 \
          zlib1g-dev zlib1g-dev:i386

    - name: Configure CMake
      shell: bash
      run: >
        cmake -S $GITHUB_WORKSPACE -B build -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_TOOLCHAIN_FILE=cmake/Toolchains/linux-i686.cmake
        -DBuildMPDed=OFF -DBuildMPEngine=ON -DBuildMPRdVanilla=ON -DBuildMPCGame=OFF
        -DBuildMPUI=OFF -DBuildSPEngine=OFF -DBuildSPGame=OFF -DBuildSPRdVanilla=OFF
        -DUseInternalPNG=ON -DUseInternalJPEG=ON -DBuildMPRdVulkan=ON -DBuildMPRend2=ON

    - name: Build
      shell: bash
      working-directory: build
      run: |
        cmake --build .
        mv codemp/rd-vanilla/rd-vanilla-mbii_i386.so .
        mv codemp/rd-vulkan/rd-vulkan-mbii_i386.so .
        mv codemp/rd-rend2/rd-rend2-mbii_i386.so .

    - name: Upload Build
      uses: actions/upload-artifact@v4
      with:
        name: Linux Client Build Release
        path: |
          build/*.i386
          build/*.so

  linux-old:
    name: Build Linux Server (Release)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      shell: bash
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get -q update
        sudo apt-get -q install -y --no-install-recommends \
          gcc-multilib g++-multilib cmake \
          libjpeg-dev libjpeg-dev:i386 \
          libpng-dev libpng-dev:i386 \
          zlib1g-dev zlib1g-dev:i386

    - name: Configure CMake
      shell: bash
      run: >
        cmake -S $GITHUB_WORKSPACE -B build -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_TOOLCHAIN_FILE=cmake/Toolchains/linux-i686.cmake
        -DBuildMPDed=ON -DBuildMPEngine=OFF -DBuildMPRdVanilla=OFF -DBuildMPCGame=OFF
        -DBuildMPUI=OFF -DBuildSPEngine=OFF -DBuildSPGame=OFF -DBuildSPRdVanilla=OFF
        -DBuildMPRdVulkan=OFF -DBuildMPRend2=OFF

    - name: Build
      shell: bash
      working-directory: build
      run: cmake --build .

    - name: Upload Build
      uses: actions/upload-artifact@v4
      with:
        name: Linux Server Build Release
        path: build/*.i386
