name: Build

on:
  workflow_dispatch:
  push:
    branches: [experimental]

# Only one run per branch at a time; a new push cancels the superseded run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  windows:
    name: Build Windows Server (VS 2022, Win32, Release)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      shell: powershell
      run: >
        cmake -S $env:GITHUB_WORKSPACE -B build -A Win32 -DBuildPortableVersion=ON
        -DBuildMPDed=ON -DBuildMPEngine=OFF -DBuildMPRdVanilla=OFF -DBuildMPCGame=OFF
        -DBuildMPUI=OFF -DBuildSPEngine=OFF -DBuildSPGame=OFF -DBuildSPRdVanilla=OFF
        -DBuildMPRdVulkan=OFF -DBuildMPRend2=OFF

    - name: Build
      shell: powershell
      run: cmake --build build --config Release

    - name: Set LAA
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Apply LAA flag
      shell: powershell
      run: editbin.exe /largeaddressaware build/Release/mbiided.x86.exe

    - name: Upload Build
      uses: actions/upload-artifact@v4
      with:
        name: Windows Server Build Release
        path: build/Release/mbiided.x86.exe
        retention-days: 7

  linux-old:
    name: Build Linux Server (Release)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      shell: bash
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get -q update
        sudo apt-get -q install -y --no-install-recommends \
          gcc-multilib g++-multilib cmake \
          libjpeg-dev libjpeg-dev:i386 \
          libpng-dev libpng-dev:i386 \
          zlib1g-dev zlib1g-dev:i386

    - name: Configure CMake
      shell: bash
      run: >
        cmake -S $GITHUB_WORKSPACE -B build -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_TOOLCHAIN_FILE=cmake/Toolchains/linux-i686.cmake
        -DBuildMPDed=ON -DBuildMPEngine=OFF -DBuildMPRdVanilla=OFF -DBuildMPCGame=OFF
        -DBuildMPUI=OFF -DBuildSPEngine=OFF -DBuildSPGame=OFF -DBuildSPRdVanilla=OFF
        -DBuildMPRdVulkan=OFF -DBuildMPRend2=OFF

    - name: Build
      shell: bash
      working-directory: build
      run: cmake --build .

    - name: Upload Build
      uses: actions/upload-artifact@v4
      with:
        name: Linux Server Build Release
        path: build/*.i386
        retention-days: 7

  release:
    name: Publish latest binaries (rolling release)
    runs-on: ubuntu-latest
    needs: [windows, linux-old]
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: latest

    - name: Publish rolling release
      uses: ncipollo/release-action@v1
      with:
        tag: latest-${{ github.ref_name }}
        name: Latest build (${{ github.ref_name }})
        body: |
          Rolling build of the MB2OpenJK dedicated server from branch `${{ github.ref_name }}` (`${{ github.sha }}`). Assets are replaced on every build, so only one version is listed.

          These are **dedicated servers only** (no client/engine, renderer, or `cgame`/`jampgame`/`ui` DLLs). You need a Jedi Academy install with Movie Battles II data to run them. Both are portable builds (no home-directory writes).

          | Asset | Platform | What it does |
          | --- | --- | --- |
          | `mbiided.x86.exe` | Windows 32-bit | MBII dedicated server (`BuildMPDed`). Host a server on Windows. Built with `LargeAddressAware` so it can use >2GB RAM. |
          | `mbiided.i386` | Linux 32-bit (i686) | Same MBII dedicated server for Linux hosts. `chmod +x` then run. |
        allowUpdates: true
        replacesArtifacts: true
        removeArtifacts: true
        artifacts: "latest/**/*"
        token: ${{ secrets.GITHUB_TOKEN }}
